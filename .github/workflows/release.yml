# Ordered, idempotent per-PR releases. See .github/RELEASING.md.
#
# Every trigger runs the same reconcile algorithm over main's first-parent
# history (.github/scripts/release/cli.mjs). Events only *wake up* the
# reconciler; they never carry the version, the order or the data used.
#
# Security notes:
# - pull_request_target never checks out or runs PR head code: we check out
#   the trusted default-branch commit (github.sha) only.
# - PR title/body/labels are never interpolated into scripts; the script
#   re-queries the PR through the API and treats it as data.
# - Tags/releases created with GITHUB_TOKEN do not trigger other workflows.

name: Release

on:
    pull_request_target:
        types: [closed]
        branches: [main]
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            pr:
                description: "Merged PR number to reconcile up to (empty = everything pending)"
                required: false
                type: string
                default: ""
            dry_run:
                description: "Dry run: report the plan, make no writes"
                required: false
                type: boolean
                default: true

permissions: {}

# A single publisher. GitHub keeps at most one *pending* run per group (newer
# pending runs replace older ones); that is harmless because every run
# reconciles the whole history, so a dropped event loses nothing.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Reconcile releases
        if: >-
            github.repository == 'offline-agency/laravel-cart' && (
              (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
              (github.event_name == 'workflow_run' &&
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main' &&
                github.event.workflow_run.head_repository.full_name == github.repository) ||
              (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
            )
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write # annotated tags + releases
            pull-requests: read # re-query merged PRs
            checks: read # "CI passed" check run
            actions: read # CI workflow runs
        steps:
            - name: Check out the trusted default-branch commit (no PR code)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Reconcile
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: node .github/scripts/release/cli.mjs --event
